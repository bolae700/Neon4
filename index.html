      const HomeIcon = ({ className }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 9.5V20a1 1 0 0 0 1 1h4M8 21V14h8v7m4-11.5V20a1 1 0 0 1-1 1h-4" /><path d="M2 10.5l10-8 10 8" /></svg>);

      const PrevIcon = () => <svg viewBox="0 0 24 24" fill="currentColor" className="w-5 h-5"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"></path></svg>;
      const NextIcon = () => <svg viewBox="0 0 24 24" fill="currentColor" className="w-5 h-5"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"></path></svg>;

      // --- WEATHER ICONS ---
      const SunnyIcon = ({ className }) => (<svg className={className} viewBox="0 0 64 64" fill="none" stroke="currentColor" strokeWidth="3"><circle cx="32" cy="32" r="10" fill="#FFD166"/><path d="M32 2v6M32 56v6M2 32h6M56 32h6M8.7 8.7l4.2 4.2M51.1 51.1l-4.2-4.2M8.7 55.3l4.2-4.2M51.1 12.9l-4.2 4.2" strokeLinecap="round"/></svg>);
      const ClearNightIcon = ({ className }) => (<svg className={className} viewBox="0 0 64 64" fill="#F8F9FA" stroke="currentColor" strokeWidth="3"><path d="M42.2 45.8A16 16 0 1129.5 18a12 12 0 0017.3 17.3 16.2 16.2 0 01-4.6 10.5z"/></svg>);
      const CloudyIcon = ({ className }) => (<svg className={className} viewBox="0 0 64 64" stroke="currentColor" strokeWidth="3"><path d="M46.7 42.5h-29a8 8 0 010-16h.3a12 12 0 0123.4-6 10 10 0 019.3 14v.2a8 8 0 01-4 7.8z" fill="#F8F9FA"/></svg>);
      const RainyIcon = ({ className }) => (<svg className={className} viewBox="0 0 64 64" fill="none" stroke="currentColor" strokeWidth="3"><path d="M46.7 42.5h-29a8 8 0 010-16h.3a12 12 0 0123.4-6 10 10 0 019.3 14v.2a8 8 0 01-4 7.8z" fill="#F8F9FA"/><path d="M24 50l-2 4M32 50l-2 4M40 50l-2 4" stroke="#00C6FF" strokeLinecap="round"/></svg>);
      const PartlyCloudyIcon = ({ className }) => (<svg className={className} viewBox="0 0 64 64" fill="none" stroke="currentColor" strokeWidth="3"><circle cx="26" cy="26" r="10" fill="#FFD166"/><path d="M46.7 42.5h-29a8 8 0 010-16h.3a12 12 0 0123.4-6 10 10 0 019.3 14v.2a8 8 0 01-4 7.8z" fill="#F8F9FA"/></svg>);
      const PartlyCloudyNightIcon = ({ className }) => (<svg className={className} viewBox="0 0 64 64" fill="none" stroke="currentColor" strokeWidth="3"><path d="M38.2 43.8A12.1 12.1 0 1128 20.3a9 9 0 0014 14 12 12 0 01-3.8 9.5z" fill="#F8F9FA"/><path d="M46.7 42.5h-29a8 8 0 010-16h.3a12 12 0 0123.4-6 10 10 0 019.3 14v.2a8 8 0 01-4 7.8z" fill="#F8F9FA"/></svg>);
      const StormyIcon = ({ className }) => (<svg className={className} viewBox="0 0 64 64" fill="none" stroke="currentColor" strokeWidth="3"><path d="M46.7 42.5h-29a8 8 0 010-16h.3a12 12 0 0123.4-6 10 10 0 019.3 14v.2a8 8 0 01-4 7.8z" fill="#9CA3AF"/><path d="M34 44l-6 8h8l-4 8" stroke="#FFD166" strokeLinecap="round" strokeLinejoin="round"/></svg>);
      const SnowyIcon = ({ className }) => (<svg className={className} viewBox="0 0 64 64" fill="none" stroke="currentColor" strokeWidth="3"><path d="M46.7 42.5h-29a8 8 0 010-16h.3a12 12 0 0123.4-6 10 10 0 019.3 14v.2a8 8 0 01-4 7.8z" fill="#F8F9FA"/><path d="M26 52l4 4m-4-4l-4 4m4-4l0-6m0 10l0-6M42 52l4 4m-4-4l-4 4m4-4l0-6m0 10l0-6" stroke="#00C6FF" strokeLinecap="round"/></svg>);
      const FogIcon = ({ className }) => (<svg className={className} viewBox="0 0 64 64" fill="none" stroke="currentColor" strokeWidth="3"><path d="M46.7 42.5h-29a8 8 0 010-16h.3a12 12 0 0123.4-6 10 10 0 019.3 14v.2a8 8 0 01-4 7.8z" fill="#F8F9FA"/><path d="M12 52h40M16 58h32" strokeLinecap="round"/></svg>);
      const DefaultWeatherIcon = ({ className }) => PartlyCloudyIcon({ className });

      // --- HOOKS ---
      const useAudioPlayer = (tracks) => {
          const audioRef = useRef(null);
          const [currentTrackIndex, setCurrentTrackIndex] = useState(0);
          const [isPlaying, setIsPlaying] = useState(false);
          const [progress, setProgress] = useState(0);
          const [error, setError] = useState(null);
          const attemptedTracksRef = useRef(new Set());
          const isSkippingRef = useRef(false);

          const playNextTrack = useCallback(() => {
              attemptedTracksRef.current.add(currentTrackIndex);
              if (attemptedTracksRef.current.size >= tracks.length) {
                  setError("Error: All tracks seem to be unavailable.");
                  setIsPlaying(false);
                  isSkippingRef.current = false;
                  return;
              }
              setCurrentTrackIndex(prev => (prev + 1) % tracks.length);
          }, [currentTrackIndex, tracks.length]);
          
          const handleAudioError = useCallback(() => {
              if (isSkippingRef.current) return;
              
              console.warn(`Failed to load track: ${tracks[currentTrackIndex].title}`);
              setError(`Skipping: "${tracks[currentTrackIndex].title}"`);
              isSkippingRef.current = true;
              
              setTimeout(() => {
                  isSkippingRef.current = false;
                  playNextTrack();
              }, 1000);
          }, [currentTrackIndex, tracks, playNextTrack]);

          const resetPlaybackState = useCallback(() => {
              attemptedTracksRef.current.clear();
              setError(null);
          }, []);

          useEffect(() => {
              const audio = audioRef.current;
              if (!audio) return;
              
              audio.src = tracks[currentTrackIndex].url;
              audio.load();
              
              if (isPlaying) {
                  const playPromise = audio.play();
                  if (playPromise !== undefined) {
                      playPromise.catch(e => {
                          console.warn("Autoplay after track change failed.", e);
                          setIsPlaying(false);
                      });
                  }
              }
          // eslint-disable-next-line react-hooks/exhaustive-deps
          }, [currentTrackIndex]);

          useEffect(() => {
              const audio = audioRef.current;
              if (!audio) return;
              const updateProgress = () => setProgress(audio.duration ? (audio.currentTime / audio.duration) * 100 : 0);
              const onEnded = () => {
                  resetPlaybackState();
                  playNextTrack();
              };
              const onPlay = () => {
                  resetPlaybackState();
                  setIsPlaying(true);
              };
              const onPause = () => setIsPlaying(false);
              
              audio.addEventListener('timeupdate', updateProgress);
              audio.addEventListener('ended', onEnded);
              audio.addEventListener('play', onPlay);
              audio.addEventListener('pause', onPause);
              audio.addEventListener('error', handleAudioError);
              
              return () => {
                  audio.removeEventListener('timeupdate', updateProgress);
                  audio.removeEventListener('ended', onEnded);
                  audio.removeEventListener('play', onPlay);
                  audio.removeEventListener('pause', onPause);
                  audio.removeEventListener('error', handleAudioError);
              };
          }, [currentTrackIndex, tracks.length, handleAudioError, playNextTrack, resetPlaybackState]);
          
          const onTogglePlay = () => {
              resetPlaybackState();
              const audio = audioRef.current;
              if (!audio) return;

              if (audio.paused) {
                  const playPromise = audio.play();
                  if (playPromise !== undefined) {
                      playPromise.catch(handleAudioError);
                  }
              } else {
                  audio.pause();
              }
          };

          const onNext = () => {
              resetPlaybackState();
              playNextTrack();
          };

          const onPrev = () => {
              resetPlaybackState();
              setCurrentTrackIndex(prev => (prev - 1 + tracks.length) % tracks.length);
          };

          const onSelectTrack = (index) => {
              resetPlaybackState();
              if(index !== currentTrackIndex) {
                  setCurrentTrackIndex(index);
              } else {
                  onTogglePlay();
              }
          };

          return { audioRef, currentTrackIndex, isPlaying, progress, error, onTogglePlay, onNext, onPrev, onSelectTrack };
      };

      // --- COMPONENTS ---
      const Window = ({ children, title, onClose, animationClass, className = '' }) => (
        <div className={`relative bg-brand-off-white border-4 border-brand-border rounded-2xl flex flex-col w-[90vw] h-[85vh] overflow-hidden shadow-sharp transition-all duration-300 ${animationClass} ${className}`}>

      );

      const Dock = ({ onIconClick, activeView }) => {
        const dockItems = [
          { id: 'home', icon: HomeIcon, color: 'text-accent-red' },

                  <Icon className={`w-9 h-9 ${item.color}`} />

      };

      const HomeContent = () => (
        <div className="flex flex-col items-center justify-around text-center h-full p-4 py-8 overflow-y-auto">
          <div className="flex flex-col items-center gap-4 animate-float">
            <div className="p-1.5 bg-accent-yellow rounded-full transition-transform duration-300 ease-in-out hover:scale-110 hover:-rotate-6">
                <img 
                  src="https://xatimg.com/image/xHLWxrdb6TqD.png" 
                  alt="Pola Sovereign" 
                  className="w-32 h-32 md:w-36 md:h-36 object-cover rounded-full border-4 border-brand-off-white"
                />
            </div>
            <div className="flex flex-col">
              <h1 className="font-righteous text-3xl md:text-4xl leading-none tracking-tighter">
                <span className="text-accent-red">POLA</span>
                <span className="text-accent-yellow"> SOVEREIGN</span>
              </h1>
              <p className="font-righteous text-base md:text-lg text-brand-muted">BY GRACE</p>
            </div>
            <p className="font-righteous text-lg md:text-xl text-accent-green">
              ❤ GOD IS LOVE ❤
            </p>
          </div>

          <div className="max-w-xs text-sm text-brand-text leading-relaxed mt-8">
            <p className="font-bold">
                Dominion is not seized, but granted. Forged in faith, executed with authority.
            </p>
            <p className="italic text-brand-muted mt-4">
                "I can do all things through Christ who gives me strength."
                <span className="font-bold not-italic block mt-1 text-brand-text">— Philippians 4:13</span>
            </p>
          </div>
        </div>
      );


      const ClockContent = () => {
        const [date, setDate] = useState(new Date());
        useEffect(() => {
          const timerId = setInterval(() => setDate(new Date()), 1000);
          return () => clearInterval(timerId);
        }, []);
        const timeOptions = { hour: '2-digit', minute: '2-digit', hour12: true };
        const dateOptions = { weekday: 'long', month: 'long', day: 'numeric' };
        
        return (
          <div className="flex flex-col items-center justify-center h-full text-center">
             <div className="font-righteous text-6xl sm:text-7xl md:text-8xl font-black text-accent-red leading-none">
                 {date.toLocaleTimeString('en-US', timeOptions).replace(' ', '')}
             </div>
             <div className="font-righteous text-lg sm:text-xl text-accent-green mt-3 font-bold">
                 {date.toLocaleDateString('en-US', dateOptions)}
             </div>
          </div>
        );
      };
      
      const WeatherContent = () => {
        const [weather, setWeather] = useState(null);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);
        const isMounted = useRef(true);

        const fetchWeather = useCallback(() => {
          if (!isMounted.current) return;
          setLoading(true);
          setError(null);
          
          fetch(`https://wttr.in/?format=j1`)
              .then(res => { 
                  if (!res.ok) throw new Error('Failed to fetch weather data. The service might be temporarily unavailable.');
                  return res.json(); 
              })
              .then(data => { 
                  if (isMounted.current) setWeather(data); 
              })
              .catch(err => { 
                  if (isMounted.current) setError(err.message); 
              })
              .finally(() => { 
                  if (isMounted.current) setLoading(false); 
              });
        }, []);

        useEffect(() => {
          isMounted.current = true;
          fetchWeather();
          return () => { isMounted.current = false; };
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, []);

        const isNight = (weatherData) => {
          if (!weatherData?.weather?.[0]?.astronomy?.[0]) return false;
          const { sunrise, sunset } = weatherData.weather[0].astronomy[0];
          const now = new Date();
          const currentTimeInMinutes = now.getHours() * 60 + now.getMinutes();

          const parseTime = (timeStr) => { // "06:30 AM"
            const [time, modifier] = timeStr.split(' ');
            let [hours, minutes] = time.split(':').map(Number);
            if (modifier === 'PM' && hours < 12) hours += 12;
            if (modifier === 'AM' && hours === 12) hours = 0; // Midnight case
            return hours * 60 + minutes;
          };
          try {
            const sunriseInMinutes = parseTime(sunrise);
            const sunsetInMinutes = parseTime(sunset);
            return currentTimeInMinutes < sunriseInMinutes || currentTimeInMinutes > sunsetInMinutes;
          } catch(e) {
            console.error("Could not parse sunrise/sunset times:", e);
            return false;
          }
        };

        const getWeatherIconComponent = (code, weatherData) => {
          const night = isNight(weatherData);
          const codeNum = parseInt(code, 10);
          
          if (night) {
            if (codeNum === 113) return ClearNightIcon;
            if (codeNum === 116) return PartlyCloudyNightIcon;
          }
          
          if (codeNum === 113) return SunnyIcon;
          if (codeNum === 116) return PartlyCloudyIcon;
          if (codeNum >= 119 && codeNum <= 122) return CloudyIcon;
          if ((codeNum >= 176 && codeNum <= 185) || (codeNum >= 263 && codeNum <= 308)) return RainyIcon;
          if (codeNum >= 323 && codeNum <= 338) return SnowyIcon;
          if (codeNum === 200) return StormyIcon;
          if (codeNum === 143 || codeNum === 248 || codeNum === 260) return FogIcon;
          
          return DefaultWeatherIcon;
        };
        
        const renderContent = () => {
            if (loading) return <div className="flex flex-col items-center justify-center text-center"><div className="w-16 h-16 border-4 border-dashed rounded-full animate-spin border-accent-yellow mb-4"></div><p className="text-xl font-bold text-brand-muted">Fetching weather...</p></div>;
            if (error) return <div className="text-center text-accent-red"><p className="font-bold text-lg">Oops!</p><p>{error}</p> <button onClick={fetchWeather} className="mt-4 bg-accent-yellow text-brand-border font-bold py-2 px-4 rounded-lg border-2 border-brand-border shadow-sharp transition-transform hover:scale-105">Try Again</button></div>;
            
            const current = weather?.current_condition?.[0];
            const area = weather?.nearest_area?.[0];
            if (!weather || !current || !area) return <div className="text-center text-accent-red"><p>Incomplete weather data received.</p><button onClick={fetchWeather} className="mt-4 bg-accent-yellow text-brand-border font-bold py-2 px-4 rounded-lg border-2 border-brand-border shadow-sharp transition-transform hover:scale-105">Try Again</button></div>;
            
            const IconComponent = getWeatherIconComponent(current.weatherCode, weather);
            return (
              <div className="w-full h-full flex items-center justify-center">
                <div className="bg-white/50 backdrop-blur-sm p-6 rounded-2xl border-4 border-brand-border/20 w-full max-w-sm text-center flex flex-col items-center justify-center gap-4 font-righteous">
                    <div className="w-28 h-28 animate-pulse-slow">
                        <IconComponent className="w-full h-full text-brand-text" />
                    </div>
                    <div>
                        <p className="text-5xl font-black text-accent-red">{current.temp_C}°C</p>
                        <p className="text-xl text-brand-muted">{current.weatherDesc[0].value}</p>
                    </div>
                    <div>
                        <p className="text-2xl font-bold text-brand-muted">{area.areaName[0].value}, {area.country[0].value}</p>
                        <p className="text-lg text-accent-green">Feels like {current.FeelsLikeC}°C</p>
                    </div>
                    <div className="text-base text-brand-text">
                        <p>Wind: {current.windspeedKmph} km/h</p>
                        <p>Humidity: {current.humidity}%</p>
                    </div>
                </div>
              </div>
            );
        };
        
        return <div className="h-full flex items-center justify-center">{renderContent()}</div>;
      };

      const MusicPlayer = ({ tracks, currentTrackIndex, isPlaying, progress, error, onTogglePlay, onNext, onPrev, onSelectTrack }) => {
        const currentTrack = tracks[currentTrackIndex];
        return (
          <div className="flex flex-col h-full text-brand-text">
            <div className="text-center pb-4 flex-shrink-0 border-b-4 border-gray-100">
                <h2 className="font-righteous text-lg truncate" title={currentTrack.title}>{currentTrack.title}</h2>
                <p className="text-sm text-brand-muted">{currentTrack.artist}</p>
                {error && <p className="text-xs text-accent-red mt-1 font-bold">{error}</p>}
            </div>
            <div className="py-4 flex-shrink-0">
                <div className="flex items-center justify-center gap-6">
                  <button onClick={onPrev} className="text-brand-muted hover:text-accent-red transition-colors" aria-label="Previous track"><PrevIcon/></button>
                  <button onClick={onTogglePlay} className="w-14 h-14 rounded-full bg-accent-yellow text-brand-border border-4 border-brand-border flex items-center justify-center transition-transform hover:scale-110" aria-label={isPlaying ? 'Pause' : 'Play'}>
                    {isPlaying ? <PauseIcon /> : <PlayIcon />}
                  </button>
                  <button onClick={onNext} className="text-brand-muted hover:text-accent-red transition-colors" aria-label="Next track"><NextIcon/></button>
                </div>
                 <div className="w-full bg-gray-200 rounded-full h-2 mt-6 overflow-hidden border-2 border-gray-200">
                    <div className="bg-accent-green h-full rounded-full" style={{ width: `${progress}%`, transition: 'width 0.15s linear' }}></div>
                </div>
            </div>
            <div className="flex-grow overflow-y-auto pr-2">
              {tracks.map((track, index) => (
                <div 
                  key={index} 
                  onClick={() => onSelectTrack(index)}
                  className={`p-2 cursor-pointer rounded-lg mb-1 transition-all duration-200 border-4 ${index === currentTrackIndex ? 'bg-accent-red border-brand-border' : 'border-transparent hover:bg-gray-100 hover:translate-x-2'}`}
                >
                  <div className={`font-bold text-sm truncate ${index === currentTrackIndex ? 'text-brand-off-white' : 'text-brand-text'}`}>{track.title}</div>
                  <div className={`text-xs ${index === currentTrackIndex ? 'text-brand-off-white/80' : 'text-brand-muted'}`}>{track.artist}</div>
                </div>
              ))}
            </div>
          </div>
        );
      };

      // --- MAIN APP ---
      const App = () => {
          const [activeView, setActiveView] = useState('home');
          const [animationClass, setAnimationClass] = useState('animate-drop-in');
          const { audioRef, ...audioPlayerProps } = useAudioPlayer(tracksData);
          
          let audioCtx = useRef(null);
          const playSound = useCallback((type) => {
            if (!audioCtx.current) {
              try { audioCtx.current = new (window.AudioContext || window.webkitAudioContext)(); } 
              catch (e) { console.error("Web Audio API is not supported"); return; }
            }
            if (audioCtx.current.state === 'suspended') audioCtx.current.resume();
            
            const oscillator = audioCtx.current.createOscillator();
            const gainNode = audioCtx.current.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.current.destination);
            
            if (type === 'open') {
              oscillator.type = 'triangle';
              oscillator.frequency.setValueAtTime(880, audioCtx.current.currentTime);
              gainNode.gain.setValueAtTime(0.08, audioCtx.current.currentTime);
              gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.current.currentTime + 0.3);
            } else { // 'close'
              oscillator.type = 'sine';
              oscillator.frequency.setValueAtTime(660, audioCtx.current.currentTime);
              gainNode.gain.setValueAtTime(0.08, audioCtx.current.currentTime);
              gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.current.currentTime + 0.2);
            }
            
            oscillator.start();
            oscillator.stop(audioCtx.current.currentTime + 0.3);
          }, []);

          const closeWindow = useCallback(() => {
              if (activeView) {
                  playSound('close');
                  setAnimationClass('animate-fall-out');
                  setTimeout(() => setActiveView(null), 300);
              }
          }, [activeView, playSound]);

          const openWindow = useCallback((id) => {
              if (activeView === id) {
                  return;
              }
              playSound('open');
              if (activeView) {
                  setAnimationClass('animate-fall-out');
                  setTimeout(() => {
                      setActiveView(id);
                      setAnimationClass('animate-drop-in');
                  }, 300);
              } else {
                  setActiveView(id);
                  setAnimationClass('animate-drop-in');
              }
          }, [activeView, playSound]);

          const renderContent = () => {
              if (!activeView) return null;
              switch (activeView) {
                  case 'home': return <HomeContent />;
                  case 'clock': return <ClockContent />;
                  case 'weather': return <WeatherContent />;
                  case 'music': return <MusicPlayer tracks={tracksData} {...audioPlayerProps} />;
                  default: return null;
              }
          };

          const windowClass = activeView === 'home' ? 'max-w-sm max-h-[680px]' : 'max-w-md max-h-[600px]';

          return (
              <Fragment>
                  <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-sky-bright to-sky-deep opacity-80"></div>
                  <audio ref={audioRef} />
                  {activeView && (
                      <Window
                          key={activeView}
                          title={viewTitles[activeView]}
                          onClose={closeWindow}
                          animationClass={animationClass}
                          className={windowClass}
                      >
                          {renderContent()}
                      </Window>
                  )}
                  <Dock onIconClick={openWindow} activeView={activeView} />
              </Fragment>
          );
      };

      // --- RENDER APP ---
      window.onload = () => {
        try {
          const rootElement = document.getElementById('root');
          const root = ReactDOM.createRoot(rootElement);
          root.render(<App />);
        } catch (error) {
          console.error("Failed to render React app:", error);
          document.getElementById('root').innerHTML = `
            <div style="background-color: #FF5F57; color: #0F172A; padding: 2rem; border-radius: 1rem; border: 4px solid #0F172A; font-family: monospace;">
              <h1 style="font-size: 1.5rem; font-weight: bold;">Oops! Application Failed to Load.</h1>
              <p>There was a critical error. Please check the console for details.</p>
            </div>
          `;
        }
      };
    </script>
</body>
</html>
