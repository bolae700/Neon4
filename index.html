<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pola | SOVEREIGN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Righteous&display=swap" rel="stylesheet">
    <style>
      :root {
        --sky-blue-bright: #00C6FF;
        --sky-blue-deep: #0072FF;
        
        --accent-yellow: #FFD166;
        --accent-red: #FF5F57;
        --accent-green: #70C1B3;

        --border-color: #0F172A; /* Off-black / Deep blue */
        --text-color: #0F172A;
        --text-color-light: #F8F9FA;
        --text-muted: #475569; /* Slate gray */

        --off-white: #F8F9FA;
        --glass-bg: rgba(248, 249, 250, 0.5);
        --glass-border: rgba(255, 255, 255, 0.2);
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        font-family: 'Nunito', sans-serif;
        background-color: var(--sky-blue-deep);
        color: var(--text-color);
        margin: 0;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
      }

      .background-gradient {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: linear-gradient(45deg, var(--sky-blue-bright), var(--sky-blue-deep));
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
      }


      @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .font-righteous {
        font-family: 'Righteous', cursive;
      }
      #root {
        height: 100vh;
        width: 100vw;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 12px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.1);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background-color: var(--accent-green);
        border-radius: 10px;
        border: 3px solid var(--off-white);
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: #5aa89a;
      }


      /* Window & Content Animations */
      @keyframes drop-in {
        0% { transform: translateY(-100%) scale(0.9); opacity: 0; }
        70% { transform: translateY(10px) scale(1.02); opacity: 1; }
        100% { transform: translateY(0) scale(1); opacity: 1; }
      }
      @keyframes fall-out {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(100%) scale(0.9); opacity: 0; }
      }

      .window {
        position: relative;
        background-color: var(--off-white);
        border: 3px solid var(--border-color);
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        width: 90vw;
        max-width: 400px;
        height: 85vh;
        max-height: 600px;
        overflow: hidden; /* Important for animations */
        transition: width 0.3s ease, height 0.3s ease, max-height 0.3s ease;
      }
      
      .window.drop-in { animation: drop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
      .window.fall-out { animation: fall-out 0.3s ease-in forwards; }

      .title-bar {
        background-color: #f0f0f0;
        border-bottom: 3px solid var(--border-color);
        padding: 0.6rem 1.1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 16px 16px 0 0;
        flex-shrink: 0;
      }
      
      .title-text {
        font-weight: 700;
        font-size: 1rem;
      }
      
      .close-button {
        width: 20px;
        height: 20px;
        background: var(--accent-red);
        border: 2px solid var(--border-color);
        border-radius: 50%;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .close-button:hover { background: #E0443E; }
      
      .window-content {
        padding: 1.25rem;
        flex-grow: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* Dock Styles */
      .dock {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        background-color: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 2px solid var(--glass-border);
        border-radius: 24px;
        padding: 0.75rem;
        display: flex;
        gap: 0.75rem;
        z-index: 10000;
        transition: bottom 0.3s ease;
      }
      
      .dock-item {
        width: 60px;
        height: 60px;
        background-color: var(--off-white);
        border: 3px solid var(--border-color);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
      }
      .dock-item:hover { transform: translateY(-8px); }
      .dock-item:active { transform: translateY(-4px) scale(0.95); }
      .dock-item svg {
        width: 36px;
        height: 36px;
      }
      .dock-item.home-icon { color: var(--accent-red); }
      .dock-item.music-icon { color: var(--accent-green); }
      .dock-item.clock-icon { color: var(--accent-yellow); }

      .dock-item.active {
        background-color: var(--off-white);
        transform: translateY(-8px) scale(1.1);
      }
      
      /* Smart Responsiveness */
      @media (max-width: 480px) {
        .window {
            width: 95vw;
            height: 90vh;
            max-height: 90vh;
            border-radius: 24px;
        }
        .title-bar { border-radius: 20px 20px 0 0; }
        .dock {
            bottom: 15px;
            padding: 0.6rem;
            gap: 0.6rem;
            border-radius: 20px;
        }
        .dock-item {
            width: 55px;
            height: 55px;
            border-radius: 16px;
        }
        .window-content {
          padding: 1.1rem;
        }
      }
      
      /* Landscape / Short Screen support */
       @media (max-height: 650px) and (min-width: 481px) {
         .window {
           height: 90vh;
           max-height: 500px;
           width: 70vw;
           max-width: 600px;
         }
         .dock {
            bottom: 15px;
         }
       }
    </style>
  </head>
  <body>
    <div class="background-gradient"></div>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useState, useCallback, useRef, useEffect } = React;

      // --- COMPONENTS ---
      
      // components/Window.tsx
      const Window = ({ children, title, onClose, animationClass }) => {
        return (
          <div className={`window ${animationClass}`}>
            <div className="title-bar">
              <span className="title-text">{title}</span>
              <button className="close-button" onClick={onClose} aria-label="Close window"></button>
            </div>
            <div className="window-content">{children}</div>
          </div>
        );
      };

      // components/Navigation.tsx
      const HomeIcon = () => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <path d="M4 9.5V20a1 1 0 0 0 1 1h4M8 21V14h8v7m4-11.5V20a1 1 0 0 1-1 1h-4" />
          <path d="M2 10.5l10-8 10 8" />
        </svg>
      );
      const MusicIcon = () => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <path d="M9 18V5l12-2v13" />
          <circle cx="6" cy="18" r="3" />
          <circle cx="18" cy="16" r="3" />
        </svg>
      );
      const ClockIcon = () => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
      );
      const Dock = ({ onIconClick, activeView }) => {
        return (
          <div className="dock">
            <div className={`dock-item home-icon ${activeView === 'home' ? 'active' : ''}`} onClick={() => onIconClick('home')}><HomeIcon /></div>
            <div className={`dock-item music-icon ${activeView === 'music' ? 'active' : ''}`} onClick={() => onIconClick('music')}><MusicIcon /></div>
            <div className={`dock-item clock-icon ${activeView === 'clock' ? 'active' : ''}`} onClick={() => onIconClick('clock')}><ClockIcon /></div>
          </div>
        );
      };

      // components/HomeContent.tsx
      const HomeContent = () => {
        return (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center', height: '100%', padding: '0 1rem' }}>
            <div>
              <h1 className="font-righteous" style={{ fontSize: 'clamp(2.8rem, 10vw, 3.5rem)', margin: '0', letterSpacing: '-2px', lineHeight: 1 }}>
                <span style={{ color: 'var(--accent-red)' }}>POLA</span>
                <span style={{ color: 'var(--accent-yellow)' }}> SOVEREIGN</span>
              </h1>
              <p className="font-righteous" style={{ fontSize: '1.1rem', color: 'var(--text-muted)', marginBottom: '1rem', marginTop: '0.5rem' }}>BY GRACE</p>
              
              <p className="font-righteous" style={{ fontSize: '1.2rem', color: 'var(--accent-green)', margin: '1rem 0 1.5rem 0' }}>
                ❤ GOD IS LOVE ❤
              </p>
              
              <div style={{ maxWidth: '300px', margin: '0 auto', fontSize: '0.9rem', color: 'var(--text-color)', lineHeight: 1.6 }}>
                <p style={{ fontWeight: 'bold' }}>
                    Dominion is not seized, but granted. Forged in faith, executed with authority.
                </p>
                <p style={{ fontStyle: 'italic', color: 'var(--text-muted)', marginTop: '1.5rem' }}>
                    "I can do all things through Christ who gives me strength."
                    <span style={{ fontWeight: 'bold', fontStyle: 'normal', display: 'block', marginTop: '0.5rem', color: 'var(--text-color)' }}>— Philippians 4:13</span>
                </p>
              </div>
            </div>
          </div>
        );
      };

      // components/Clock.tsx
      const Clock = () => {
        const [date, setDate] = useState(new Date());
        useEffect(() => {
          const timerId = setInterval(() => setDate(new Date()), 1000);
          return () => clearInterval(timerId);
        }, []);
        const timeOptions = { hour: '2-digit', minute: '2-digit', hour12: true };
        const dateOptions = { weekday: 'long', month: 'long', day: 'numeric' };
        return (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100%', textAlign: 'center' }}>
             <div>
                <div className="font-righteous" style={{ fontSize: 'clamp(3.5rem, 20vw, 5rem)', fontWeight: 900, color: 'var(--accent-red)', lineHeight: 1 }}>
                    {date.toLocaleTimeString('en-US', timeOptions).replace(' ', '')}
                </div>
                <div className="font-righteous" style={{ fontSize: '1.2rem', color: 'var(--accent-green)', marginTop: '0.75rem', fontWeight: 700 }}>
                    {date.toLocaleDateString('en-US', dateOptions)}
                </div>
            </div>
          </div>
        );
      };

      // components/AudioPlayer.tsx
      const PlayIcon = () => <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M8 5v14l11-7z"></path></svg>;
      const PauseIcon = () => <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>;
      const PrevIcon = () => <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"></path></svg>;
      const NextIcon = () => <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"></path></svg>;
      const AudioPlayer = ({ tracks, currentTrackIndex, isPlaying, progress, onTogglePlay, onNext, onPrev, onSelectTrack }) => {
        const currentTrack = tracks[currentTrackIndex];
        return (
          <div style={{ display: 'flex', flexDirection: 'column', height: '100%', color: 'var(--text-color)' }}>
            <div style={{ textAlign: 'center', paddingBottom: '1rem', flexShrink: 0, borderBottom: '3px solid #f0f0f0' }}>
                <h2 className="font-righteous" style={{ fontSize: '1.1rem', textOverflow: 'ellipsis', overflow: 'hidden', whiteSpace: 'nowrap', margin: 0, color: 'var(--text-color)' }}>
                  {currentTrack.title}
                </h2>
                <p style={{ fontSize: '0.9rem', color: 'var(--text-muted)', margin: '0.25rem 0 0' }}>
                  {currentTrack.artist}
                </p>
            </div>
            <div style={{ padding: '1rem 0', flexShrink: 0 }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '1.5rem' }}>
                  <button onClick={onPrev} style={{ background: 'none', border: 'none', color: 'var(--text-muted)', cursor: 'pointer', padding: '0', transform: 'scale(1.2)', transition: 'color 0.2s ease' }} onMouseOver={e => e.currentTarget.style.color='var(--accent-red)'} onMouseOut={e => e.currentTarget.style.color='var(--text-muted)'} aria-label="Previous track"><PrevIcon/></button>
                  <button onClick={onTogglePlay} style={{ width: '56px', height: '56px', borderRadius: '50%', background: 'var(--accent-yellow)', color: 'var(--border-color)', border: '3px solid var(--border-color)', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275)' }} onMouseOver={e => e.currentTarget.style.transform='scale(1.1)'} onMouseOut={e => e.currentTarget.style.transform='scale(1)'} aria-label={isPlaying ? 'Pause' : 'Play'}>
                    {isPlaying ? <PauseIcon /> : <PlayIcon />}
                  </button>
                  <button onClick={onNext} style={{ background: 'none', border: 'none', color: 'var(--text-muted)', cursor: 'pointer', padding: '0', transform: 'scale(1.2)', transition: 'color 0.2s ease' }} onMouseOver={e => e.currentTarget.style.color='var(--accent-red)'} onMouseOut={e => e.currentTarget.style.color='var(--text-muted)'} aria-label="Next track"><NextIcon/></button>
                </div>
                 <div style={{ width: '100%', backgroundColor: '#e0e0e0', borderRadius: '99px', height: '8px', marginTop: '1.5rem', overflow: 'hidden', border: '2px solid #e0e0e0' }}>
                    <div style={{ backgroundColor: 'var(--accent-green)', height: '100%', borderRadius: '99px', width: `${progress}%`, transition: 'width 0.1s linear' }}></div>
                </div>
            </div>
            <div style={{ flexGrow: 1, overflowY: 'auto', paddingTop: '0.5rem', paddingRight: '0.5rem' }}>
              {tracks.map((track, index) => (
                <div key={index} onClick={() => onSelectTrack(index)} style={{
                  padding: '0.6rem 0.75rem',
                  cursor: 'pointer',
                  borderRadius: '12px',
                  backgroundColor: index === currentTrackIndex ? 'var(--accent-red)' : 'transparent',
                  marginBottom: '0.25rem',
                  transition: 'background-color 0.2s ease',
                  border: '3px solid',
                  borderColor: index === currentTrackIndex ? 'var(--border-color)' : 'transparent',
                }}>
                  <div style={{ fontWeight: 'bold', fontSize: '0.9rem', textOverflow: 'ellipsis', overflow: 'hidden', whiteSpace: 'nowrap', color: index === currentTrackIndex ? 'var(--off-white)' : 'var(--text-color)' }}>{track.title}</div>
                  <div style={{ fontSize: '0.8rem', color: index === currentTrackIndex ? 'var(--off-white)' : 'var(--text-muted)', opacity: index === currentTrackIndex ? 0.8 : 1 }}>{track.artist}</div>
                </div>
              ))}
            </div>
          </div>
        );
      };


      // --- MAIN APP ---
      const tracksData = [
          { url: "https://audio.jukehost.co.uk/3SwFzuOJdwkrBopTFgOzkDOT5FDN6ITH", title: "Fakrak Ya Nasiny", artist: "Mohamed Foad" }, { url: "https://audio.jukehost.co.uk/6IQhCPy39Jv5Uxj9WI4fFMeUuJMWWR2D", title: "Khalik Ganbi", artist: "Haitham Shaker" }, { url: "https://audio.jukehost.co.uk/gHFak76ZMfll7B4AxEeDbJjPRWgXvhc8", title: "Alb ElAsheq Dalelo", artist: "George Wasouf" }, { url: "https://audio.jukehost.co.uk/NuLgFpCxa1HTsUQUUVhWtBDQJ76xsQwz", title: "Seket Leih", artist: "Ramy Sabry" }, { url: "https://audio.jukehost.co.uk/LTTXfGln1F0s2pQpHLgb0JapbBOxUpGn", title: "Khosara", artist: "Mohamed Foad" }, { url: "https://audio.jukehost.co.uk/bbabQwnKnYhXlaRD8alUDCzGEhyu9Rwm", title: "Khadny 7aneen", artist: "George Wasouf" }, { url: "https://audio.jukehost.co.uk/jciF6sfSouobTpBl2Krqc3UaZfMX3oeJ", title: "Enty Nesity Nafsek", artist: "Tamer Hosny" }, { url: "https://audio.jukehost.co.uk/FhU9VQWsajSdhBd1mXmWq5kXnw1IaFLr", title: "Kol youm", artist: "Tamer Ashour" }, { url: "https://audio.jukehost.co.uk/nR6XjZwYTEh3Y5tzwS3NwKZrazhE0qGz", title: "Rabak Lama Yered", artist: "Mohamed Mounir" }, { url: "https://audio.jukehost.co.uk/kwvKuE1GOiFiyJB9r2qgbSdCEwNYicoY", title: "Shed Eldafaer", artist: "Hanan Madi" }, { url: "https://audio.jukehost.co.uk/lrUXO0jmrJRZANKo0Gx9XEQ0PFuQxKN5", title: "Yalli Bitghib Aleiya", artist: "Haitham Shaker" }, { url: "https://audio.jukehost.co.uk/eQbGikyF1Aog1gTZILSPznXQ3rLXymGw", title: "ElSabri Tayib", artist: "George Wasouf" }, { url: "https://audio.jukehost.co.uk/l2Mk2abKCcRGWpSoxSlcxBL80RAjYvMe", title: "Fagaa Eftarana", artist: "Tamer Hosny" }, { url: "https://audio.jukehost.co.uk/HN64P9ig7AsLZ1vaS9mdsGPl8q0uI8z7m", title: "Lw Batlna Nehlm", artist: "Mohamed Mounir" }, { url: "https://audio.jukehost.co.uk/f9oiefTzRGZvp6iyMJKGbxLe3ZFCv390", title: "Sed El-Habayeb", artist: "Shadia" }, { url: "https://audio.jukehost.co.uk/c77yqDnvZV6lAmIPQPanmSgqVpnlnDyv", title: "Saber W.Radi", artist: "George Wasouf" }, { url: "https://audio.jukehost.co.uk/16F3ncIKS16sa5AciCMrGmuJa9doyvDX", title: "Zkryat", artist: "George Wasouf" },
      ];
      const viewTitles = { home: 'Pola SOVEREIGN', music: 'Music Player', clock: 'Clock & Date' };
      
      let audioCtx = null;
      const playSound = (type) => {
        if (!audioCtx) {
          try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          } catch (e) {
            console.error("Web Audio API is not supported in this browser");
            return;
          }
        }
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        if (type === 'open') {
          oscillator.type = 'triangle';
          oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
          gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
        } else {
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(660, audioCtx.currentTime);
          gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
        }
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.3);
      };
      
      const App = () => {
          const [activeView, setActiveView] = useState('home');
          const [animationClass, setAnimationClass] = useState('drop-in');
          const audioRef = useRef(null);
          const [currentTrackIndex, setCurrentTrackIndex] = useState(0);
          const [isPlaying, setIsPlaying] = useState(false);
          const [progress, setProgress] = useState(0);
          const currentTrack = tracksData[currentTrackIndex];

          useEffect(() => {
              if (audioRef.current) {
                  audioRef.current.src = currentTrack.url;
                  audioRef.current.load();
                  if (isPlaying) {
                      audioRef.current.play().catch(e => console.error("Playback failed:", e));
                  }
              }
          }, [currentTrackIndex]);

          useEffect(() => {
              const audio = audioRef.current;
              if (!audio) return;
              const updateProgress = () => setProgress(audio.duration ? (audio.currentTime / audio.duration) * 100 : 0);
              const onEnded = () => setCurrentTrackIndex(prev => (prev + 1) % tracksData.length);
              const onPlay = () => setIsPlaying(true);
              const onPause = () => setIsPlaying(false);
              audio.addEventListener('timeupdate', updateProgress);
              audio.addEventListener('ended', onEnded);
              audio.addEventListener('play', onPlay);
              audio.addEventListener('pause', onPause);
              return () => {
                  audio.removeEventListener('timeupdate', updateProgress);
                  audio.removeEventListener('ended', onEnded);
                  audio.removeEventListener('play', onPlay);
                  audio.removeEventListener('pause', onPause);
              };
          }, [currentTrackIndex]);

          const handleTogglePlay = () => audioRef.current?.paused ? audioRef.current?.play() : audioRef.current?.pause();
          const handleNext = () => setCurrentTrackIndex(prev => (prev + 1) % tracksData.length);
          const handlePrev = () => setCurrentTrackIndex(prev => (prev - 1 + tracksData.length) % tracksData.length);
          const handleSelectTrack = (index) => setCurrentTrackIndex(index);

          const closeWindow = useCallback(() => {
              if (activeView) {
                  playSound('close');
                  setAnimationClass('fall-out');
                  setTimeout(() => setActiveView(null), 300);
              }
          }, [activeView]);

          const openWindow = useCallback((id) => {
              if (activeView === id) {
                  closeWindow();
              } else {
                  playSound('open');
                  if (activeView) {
                      setAnimationClass('fall-out');
                      setTimeout(() => {
                          setActiveView(id);
                          setAnimationClass('drop-in');
                      }, 300);
                  } else {
                      setActiveView(id);
                      setAnimationClass('drop-in');
                  }
              }
          }, [activeView, closeWindow]);

          const renderContent = () => {
              if (!activeView) return null;
              switch (activeView) {
                  case 'home': return <HomeContent />;
                  case 'clock': return <Clock />;
                  case 'music': return (
                      <AudioPlayer
                          tracks={tracksData}
                          currentTrackIndex={currentTrackIndex}
                          isPlaying={isPlaying}
                          progress={progress}
                          onTogglePlay={handleTogglePlay}
                          onNext={handleNext}
                          onPrev={handlePrev}
                          onSelectTrack={handleSelectTrack}
                      />
                  );
                  default: return null;
              }
          };

          return (
              <>
                  <audio ref={audioRef} src={currentTrack.url} preload="metadata" />
                  {activeView && (
                      <Window
                          key={activeView}
                          title={viewTitles[activeView]}
                          onClose={closeWindow}
                          animationClass={animationClass}
                      >
                          {renderContent()}
                      </Window>
                  )}
                  <Dock onIconClick={openWindow} activeView={activeView} />
              </>
          );
      };

      // --- RENDER APP ---
      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);

    </script>
  </body>
</html>
