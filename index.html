    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

      body {
        font-family: 'Poppins', sans-serif;
        background-color: #03008d;
        background-image: radial-gradient(circle at 50% 150%, #004eff 0%, #03008d 70%);
      }
      
      .animated-grid {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
          linear-gradient(rgba(255,255,255,0.07) 1px, transparent 1px), 
          linear-gradient(90deg, rgba(255,255,255,0.07) 1px, transparent 1px);
        background-size: 3rem 3rem;
        animation: pan-grid 200s linear infinite;
        z-index: -2;
      }
      
      @keyframes pan-grid {
        0% { background-position: 0% 0%; }
        100% { background-position: 100% 100%; }
      }

      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); opacity: 0; }
        25% { opacity: 0.2; }
        50% { transform: translateY(-50vh) rotate(180deg); }
        75% { opacity: 0.2; }
        100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
      }
      
      .name-shake:hover {
        animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
      }

      .music-note-dance:hover {
        animation: dance 0.8s ease-in-out infinite;
      }

      .heart-beat:hover {
        animation: heartbeat 1s ease-in-out infinite;
      }
      
      @keyframes shake {
        10%, 90% { transform: translate3d(-1px, 0, 0); }
        20%, 80% { transform: translate3d(2px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
        40%, 60% { transform: translate3d(4px, 0, 0); }
      }

      @keyframes dance {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-15deg) scale(1.1); }
        75% { transform: rotate(15deg) scale(1.1); }
      }

      @keyframes heartbeat {
        0% { transform: scale(1); }
        10% { transform: scale(1.3); }
        20% { transform: scale(1); }
        30% { transform: scale(1.3); }
        40% { transform: scale(1); }
        100% { transform: scale(1); }
      }

      @keyframes music-note-float {
        from { transform: translateY(0) translateX(0) scale(1); opacity: 1; }
        to { transform: translateY(-40px) translateX(var(--tx)) scale(0.5); opacity: 0; }
      }

      @keyframes rain-fall {
        from { transform: translateY(-20px) scale(1); opacity: 1; }
        to { transform: translateY(20px) scale(1); opacity: 0; }
      }

      @keyframes write-anim {
        0% { transform: translate(-5px, 10px) rotate(-30deg); opacity: 0; }
        20% { opacity: 1; }
        40% { transform: translate(0px, 5px) rotate(-30deg); }
        60% { transform: translate(5px, 10px) rotate(-30deg); }
        80% { opacity: 1; }
        100% { transform: translate(10px, 0px) rotate(-30deg); opacity: 0; }
      }

      /* Custom Scrollbar for Music Playlist */
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: rgba(255, 255, 255, 0.4);
      }
      .custom-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.2) rgba(255, 255, 255, 0.05);
      }

    import * as React from 'react';

    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ==========================================
    // HOOK: useLocalStorage
    // ==========================================
    const useLocalStorage = (key, initialValue) => {
        const [storedValue, setStoredValue] = useState(() => {
            if (typeof window === 'undefined') {
                return initialValue;
            }
            try {
                const item = window.localStorage.getItem(key);
                return item ? JSON.parse(item) : initialValue;
            } catch (error) {
                console.error(error);
                return initialValue;
            }
        });

        const setValue = (value) => {
            try {
                const valueToStore = value instanceof Function ? value(storedValue) : value;
                setStoredValue(valueToStore);
                if (typeof window !== 'undefined') {
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                }
            } catch (error) {
                console.error(error);
            }
        };

        return [storedValue, setValue];
    };

    // ==========================================
    // HOOK: useAudio
    // ==========================================
    const useAudio = () => {
        const audioContextRef = useRef(null);

        const playSound = useCallback((type) => {
            if (!audioContextRef.current) {
                try {
                    audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.error("Web Audio API is not supported in this browser.", e);
                    return;
                }
            }
            const audioContext = audioContextRef.current;
            if (!audioContext || audioContext.state === 'suspended') {
                audioContext.resume();
            }

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            gainNode.gain.setValueAtTime(0, audioContext.currentTime);

            switch (type) {
                case 'click':
                    gainNode.gain.linearRampToValueAtTime(0.2, audioContext.currentTime + 0.01);
                    oscillator.type = 'triangle';
                    oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.1);
                    break;
                case 'hover':
                    gainNode.gain.linearRampToValueAtTime(0.08, audioContext.currentTime + 0.01);
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(1200, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.05);
                    break;
                case 'open':
                    gainNode.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + 0.01);
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.15);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.2);
                    break;
                case 'swoosh':
                    gainNode.gain.linearRampToValueAtTime(0.2, audioContext.currentTime + 0.01);
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(1500, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(300, audioContext.currentTime + 0.2);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.2);
                    break;
                case 'error':
                    gainNode.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + 0.01);
                    oscillator.type = 'square';
                    oscillator.frequency.setValueAtTime(150, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 0.15);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.2);
                    break;
                case 'success':
                    gainNode.gain.linearRampToValueAtTime(0.25, audioContext.currentTime + 0.01);
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
                    oscillator.frequency.linearRampToValueAtTime(1200, audioContext.currentTime + 0.2);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.25);
                    break;
                case 'close':
                    gainNode.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + 0.01);
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.15);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.2);
                    break;
            }
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.25);
        }, []);
        return { playSound };
    };

    // ==========================================

    const mapWmoToWeather = (wmoCode, isDay) => {
        const dayNight = isDay ? 'd' : 'n';
        if (wmoCode === 0) return { main: 'Clear', description: 'Clear sky', icon: `01${dayNight}` };
        if (wmoCode >= 1 && wmoCode <= 3) return { main: 'Clouds', description: 'Cloudy', icon: `03${dayNight}` };
        if (wmoCode === 45 || wmoCode === 48) return { main: 'Fog', description: 'Fog', icon: `50${dayNight}` };
        if (wmoCode >= 51 && wmoCode <= 67) return { main: 'Rain', description: 'Rain', icon: `10${dayNight}` };
        if (wmoCode >= 71 && wmoCode <= 77) return { main: 'Snow', description: 'Snow', icon: `13${dayNight}` };
        if (wmoCode >= 80 && wmoCode <= 82) return { main: 'Rain', description: 'Rain showers', icon: `09${dayNight}` };
        if (wmoCode >= 85 && wmoCode <= 86) return { main: 'Snow', description: 'Snow showers', icon: `13${dayNight}` };
        if (wmoCode >= 95 && wmoCode <= 99) return { main: 'Thunderstorm', description: 'Thunderstorm', icon: `11${dayNight}` };
        return { main: 'Clear', description: 'Clear sky', icon: `01${dayNight}` };
    };

    const getWeather = async (lat, lon) => {
        try {
            // No city name lookup needed if we get it from IP geo
            const weatherResponse = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relativehumidity_2m,apparent_temperature,is_day,weathercode,windspeed_10m&windspeed_unit=ms`);
            
            if (!weatherResponse.ok) throw new Error('Failed to fetch weather data');
            
            const weatherData = await weatherResponse.json();
            const current = weatherData.current;
            const mappedWeather = mapWmoToWeather(current.weathercode, current.is_day);

            return {
                main: {
                    temp: current.temperature_2m,
                    feels_like: current.apparent_temperature,
                    humidity: current.relativehumidity_2m,
                },
                weather: [mappedWeather],
                wind: {
                    speed: current.windspeed_10m,
                },
            };
        } catch (error) {
            console.error("Weather data fetching error:", error);
            throw error;
        }
    };

            const audio = audioRef.current;
            return () => {

        }, []);
        
        const playNext = useCallback(() => {
            setCurrentTrackIndex((prev) => (prev + 1) % tracksData.length);
        }, [tracksData.length]);

        useEffect(() => {
            const audio = audioRef.current;
            if (!audio) return;
            
            const handlePlay = async () => {
                 try {
                    await audio.play();
                } catch (error) {
                    if (error.name !== 'AbortError') {
                        console.error("Audio playback failed:", error);
                        setIsPlaying(false);
                    }
                }
            };

            if (isPlaying) {
                const currentSrc = tracksData[currentTrackIndex].url;
                if (audio.src !== currentSrc) {
                    audio.src = currentSrc;
                    audio.load();
                    audio.addEventListener('canplaythrough', handlePlay, { once: true });
                } else {
                     handlePlay();
                }
            } else {
                audio.pause();
            }
        }, [isPlaying, currentTrackIndex, tracksData]);

        useEffect(() => {

            const updateProgress = () => setProgress(audio.duration ? (audio.currentTime / audio.duration) * 100 : 0);
