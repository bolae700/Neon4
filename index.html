      // --- CONSTANTS ---
       const tracksData = [

      // --- ICONS ---
      const HomeIcon = ({ className }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 9.5V20a1 1 0 0 0 1 1h4M8 21V14h8v7m4-11.5V20a1 1 0 0 1-1 1h-4" /><path d="M2 10.5l10-8 10 8" /></svg>);

      const PauseIcon = () => <svg viewBox="0 0 24 24" fill="currentColor" className="w-8 h-8"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>;

      const GithubIcon = ({ className }) => (<svg className={className} viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.168 6.839 9.492.5.092.682-.217.682-.482 0-.237-.009-.868-.014-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.031-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.203 2.398.1 2.651.64.7 1.03 1.595 1.03 2.688 0 3.848-2.338 4.695-4.566 4.942.359.308.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.001 10.001 0 0022 12c0-5.523-4.477-10-10-10z" /></svg>);
      const YoutubeIcon = ({ className }) => (<svg className={className} viewBox="0 0 24 24" fill="currentColor"><path d="M21.582,6.186c-0.23-0.86-0.908-1.538-1.768-1.768C18.25,4,12,4,12,4S5.75,4,4.186,4.418 c-0.86,0.23-1.538,0.908-1.768,1.768C2,7.75,2,12,2,12s0,4.25,0.418,5.814c0.23,0.86,0.908,1.538,1.768,1.768 C5.75,20,12,20,12,20s6.25,0,7.814-0.418c0.861-0.23,1.538-0.908,1.768-1.768C22,16.25,22,12,22,12S22,7.75,21.582,6.186z M10,15.464V8.536L16,12L10,15.464z" /></svg>);

      // --- WEATHER ICONS ---
      const SunnyIcon = ({ className }) => (<svg className={className} viewBox="0 0 64 64" fill="none" stroke="#FFD166" strokeWidth="3"><circle cx="32" cy="32" r="10"/><path d="M32 2v6M32 56v6M2 32h6M56 32h6M8.7 8.7l4.2 4.2M51.1 51.1l-4.2-4.2M8.7 55.3l4.2-4.2M51.1 12.9l-4.2 4.2" strokeLinecap="round"/></svg>);
      const ClearNightIcon = ({ className }) => (<svg className={className} viewBox="0 0 64 64" fill="#F8F9FA" stroke="#F8F9FA" strokeWidth="3"><path d="M42.2 45.8A16 16 0 1129.5 18a12 12 0 0017.3 17.3 16.2 16.2 0 01-4.6 10.5z"/></svg>);
      const CloudyIcon = ({ className }) => (<svg className={className} viewBox="0 0 64 64" stroke="#F8F9FA" strokeWidth="3" fill="#F8F9FA"><path d="M46.7 42.5h-29a8 8 0 010-16h.3a12 12 0 0123.4-6 10 10 0 019.3 14v.2a8 8 0 01-4 7.8z"/></svg>);
      const RainyIcon = ({ className }) => (<svg className={className} viewBox="0 0 64 64" fill="none" strokeWidth="3"><path d="M46.7 42.5h-29a8 8 0 010-16h.3a12 12 0 0123.4-6 10 10 0 019.3 14v.2a8 8 0 01-4 7.8z" fill="#F8F9FA" stroke="#F8F9FA"/><path d="M24 50l-2 4M32 50l-2 4M40 50l-2 4" stroke="#00C6FF" strokeLinecap="round"/></svg>);
      const PartlyCloudyIcon = ({ className }) => (<svg className={className} viewBox="0 0 64 64" fill="none" strokeWidth="3"><circle cx="26" cy="26" r="10" fill="#FFD166" stroke="#FFD166"/><path d="M46.7 42.5h-29a8 8 0 010-16h.3a12 12 0 0123.4-6 10 10 0 019.3 14v.2a8 8 0 01-4 7.8z" fill="#F8F9FA" stroke="#F8F9FA"/></svg>);
      const PartlyCloudyNightIcon = ({ className }) => (<svg className={className} viewBox="0 0 64 64" fill="none" strokeWidth="3"><path d="M38.2 43.8A12.1 12.1 0 1128 20.3a9 9 0 0014 14 12 12 0 01-3.8 9.5z" fill="#F8F9FA" stroke="#F8F9FA"/><path d="M46.7 42.5h-29a8 8 0 010-16h.3a12 12 0 0123.4-6 10 10 0 019.3 14v.2a8 8 0 01-4 7.8z" fill="#F8F9FA" stroke="#F8F9FA"/></svg>);
      const StormyIcon = ({ className }) => (<svg className={className} viewBox="0 0 64 64" fill="none" strokeWidth="3"><path d="M46.7 42.5h-29a8 8 0 010-16h.3a12 12 0 0123.4-6 10 10 0 019.3 14v.2a8 8 0 01-4 7.8z" fill="#9CA3AF" stroke="#9CA3AF"/><path d="M34 44l-6 8h8l-4 8" stroke="#FFD166" strokeLinecap="round" strokeLinejoin="round"/></svg>);
      const SnowyIcon = ({ className }) => (<svg className={className} viewBox="0 0 64 64" fill="none" strokeWidth="3"><path d="M46.7 42.5h-29a8 8 0 010-16h.3a12 12 0 0123.4-6 10 10 0 019.3 14v.2a8 8 0 01-4 7.8z" fill="#F8F9FA" stroke="#F8F9FA"/><path d="M26 52l4 4m-4-4l-4 4m4-4l0-6m0 10l0-6M42 52l4 4m-4-4l-4 4m4-4l0-6m0 10l0-6" stroke="#00C6FF" strokeLinecap="round"/></svg>);
      const FogIcon = ({ className }) => (<svg className={className} viewBox="0 0 64 64" fill="none" strokeWidth="3"><path d="M46.7 42.5h-29a8 8 0 010-16h.3a12 12 0 0123.4-6 10 10 0 019.3 14v.2a8 8 0 01-4 7.8z" fill="#F8F9FA" stroke="#F8F9FA"/><path d="M12 52h40M16 58h32" stroke="#F8F9FA" strokeLinecap="round"/></svg>);
      const DefaultWeatherIcon = ({ className }) => PartlyCloudyIcon({ className });

      // --- HOOKS ---
      const useAudioPlayer = (tracks) => {
          const audioRef = useRef(null);
          const [currentTrackIndex, setCurrentTrackIndex] = useState(0);
          const [isPlaying, setIsPlaying] = useState(false);
          const [progress, setProgress] = useState(0);
          const [error, setError] = useState(null);

          const playNextTrack = useCallback(() => {
              setCurrentTrackIndex(prev => (prev + 1) % tracks.length);
          }, [tracks.length]);
          
          const handleAudioError = useCallback((e) => {
              console.warn(`Failed to load track: ${tracks[currentTrackIndex].title}`, e);
              setError(`Skipping: "${tracks[currentTrackIndex].title}"`);
              setTimeout(playNextTrack, 1000);
          }, [currentTrackIndex, tracks, playNextTrack]);

          const resetError = () => setError(null);

          useEffect(() => {
              const audio = audioRef.current;
              if (!audio || !tracks[currentTrackIndex]) return;
              
              audio.src = tracks[currentTrackIndex].url;
              audio.load();
              
              if (isPlaying) {
                  audio.play().catch(handleAudioError);
              }
          // eslint-disable-next-line react-hooks/exhaustive-deps
          }, [currentTrackIndex, tracks]);

          useEffect(() => {
              const audio = audioRef.current;
              if (!audio) return;
              const updateProgress = () => setProgress(audio.duration ? (audio.currentTime / audio.duration) * 100 : 0);
              const onEnded = () => playNextTrack();
              const onPlay = () => { resetError(); setIsPlaying(true); };
              const onPause = () => setIsPlaying(false);
              
              audio.addEventListener('timeupdate', updateProgress);
              audio.addEventListener('ended', onEnded);
              audio.addEventListener('play', onPlay);
              audio.addEventListener('pause', onPause);
              audio.addEventListener('error', handleAudioError);
              
              return () => {
                  audio.removeEventListener('timeupdate', updateProgress);
                  audio.removeEventListener('ended', onEnded);
                  audio.removeEventListener('play', onPlay);
                  audio.removeEventListener('pause', onPause);
                  audio.removeEventListener('error', handleAudioError);
              };
          }, [handleAudioError, playNextTrack]);
          
          const onTogglePlay = () => {
              const audio = audioRef.current;
              if (!audio) return;
              if (audio.paused) {
                  audio.play().catch(handleAudioError);
              } else {
                  audio.pause();
              }
          };

          const onNext = () => playNextTrack();
          const onPrev = () => setCurrentTrackIndex(prev => (prev - 1 + tracks.length) % tracks.length);
          const onSelectTrack = (index) => {
              if(index !== currentTrackIndex) {
                  setCurrentTrackIndex(index);
              } else {
                  onTogglePlay();
              }
          };

          return { audioRef, currentTrackIndex, isPlaying, progress, error, onTogglePlay, onNext, onPrev, onSelectTrack };
      };

      // --- COMPONENTS ---
      const Window = ({ children, title, onClose, animationClass, className = '' }) => (
        <div className={`relative bg-brand-bg/70 backdrop-blur-2xl border-2 border-white/10 rounded-2xl flex flex-col w-[90vw] h-[85vh] overflow-hidden shadow-2xl shadow-black/30 transition-all duration-300 ${animationClass} ${className}`}>
            <div className="bg-black/20 border-b-2 border-white/10 px-6 py-3 flex items-center justify-between rounded-t-xl flex-shrink-0">

              <button className="w-6 h-6 bg-accent-red border-2 border-black/50 rounded-full cursor-pointer hover:scale-110 transition-transform" onClick={onClose} aria-label="Close window"></button>

            <div className="p-6 flex-grow overflow-hidden flex flex-col">{children}</div>

      const Dock = ({ onIconClick, activeView }) => {
        const dockItems = [
          { id: 'home', icon: HomeIcon, color: 'text-accent-red' },
          { id: 'music', icon: MusicIcon, color: 'text-accent-green' },
          { id: 'clock', icon: ClockIcon, color: 'text-accent-yellow' },
          { id: 'weather', icon: WeatherIcon, color: 'text-sky-bright' },

        return (
          <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-black/30 backdrop-blur-md border border-white/20 rounded-2xl p-3 flex gap-4 z-50">
            {dockItems.map(item => {
              const Icon = item.icon;
              const isActive = activeView === item.id;
              return (
                <div key={item.id} onClick={() => onIconClick(item.id)} className={`w-16 h-16 bg-brand-bg/80 border-2 border-white/10 rounded-xl flex items-center justify-center cursor-pointer transition-all duration-300 ease-in-out shadow-lg shadow-black/30 hover:-translate-y-2 hover:shadow-glow-sky ${isActive ? '-translate-y-2 shadow-glow-sky' : ''}`}>
                  <Icon className={`w-10 h-10 ${item.color} transition-colors`} />
                </div>
              );
            })}
          </div>
        );
      };

      const HomeContent = ({ date, weather }) => {
        const timeOptions = { hour: '2-digit', minute: '2-digit', hour12: true };
        const currentTemp = weather?.current_condition?.[0]?.temp_C;
        const weatherDesc = weather?.current_condition?.[0]?.weatherDesc[0]?.value;

        return (
            <div className="flex flex-col items-center justify-between text-center h-full py-6 px-4 overflow-y-auto">
                <div className="w-full flex justify-between items-start">
                    <div className="text-left">
                        <p className="font-righteous text-5xl text-accent-red leading-none">{date.toLocaleTimeString('en-US', timeOptions).replace(' ', '')}</p>
                    </div>
                     <div className="text-right">
                        {currentTemp && weatherDesc && (
                            <Fragment>
                                <p className="font-righteous text-5xl text-sky-deep leading-none">{currentTemp}°C</p>
                                <p className="text-sm font-bold text-brand-muted">{weatherDesc}</p>
                            </Fragment>
                        )}
                    </div>
                </div>

                <div className="flex flex-col items-center gap-4 animate-float -mt-8">
                    <div className="p-2 bg-accent-yellow rounded-full transition-transform duration-300 ease-in-out hover:scale-110 hover:-rotate-6 shadow-lg">
                        <img src="https://xatimg.com/image/xHLWxrdb6TqD.png" alt="Pola Sovereign" className="w-36 h-36 object-cover rounded-full border-4 border-brand-bg"/>
                    </div>
                    <div>
                        <h1 className="font-righteous text-5xl leading-none tracking-tighter"><span className="text-accent-red">POLA</span><span className="text-accent-yellow"> SOVEREIGN</span></h1>
                        <p className="font-righteous text-xl text-brand-muted tracking-widest">BY GRACE</p>
                    </div>
                </div>

                <div className="flex flex-col items-center gap-6">
                    <div className="max-w-md text-lg text-brand-off-white leading-relaxed">
                        <p className="font-bold">Dominion is not seized, but granted.</p>
                        <p className="italic text-brand-muted mt-1">"I can do all things through Christ who gives me strength."</p>
                    </div>
                    <div className="flex items-center justify-center bg-black/20 backdrop-blur-sm p-3 rounded-full gap-4 border border-white/10">
                        <a href="https://github.com/bolae700" target="_blank" rel="noopener noreferrer" className="w-12 h-12 flex items-center justify-center rounded-full text-brand-muted hover:bg-white/10 hover:text-brand-off-white transition-all duration-300" aria-label="GitHub"><GithubIcon className="w-8 h-8" /></a>
                        <a href="https://youtube.com/@SoundSurge3" target="_blank" rel="noopener noreferrer" className="w-12 h-12 flex items-center justify-center rounded-full text-brand-muted hover:bg-white/10 hover:text-brand-off-white transition-all duration-300" aria-label="YouTube"><YoutubeIcon className="w-9 h-9" /></a>
                    </div>
                </div>
            </div>
        );
      };

      const ClockContent = ({ date }) => {
        const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
        const dateOptions = { weekday: 'long', month: 'long', day: 'numeric' };
        
        return (
          <div className="flex flex-col items-center justify-center h-full text-center p-4">
             <div className="font-righteous text-7xl sm:text-8xl font-black text-accent-red leading-none tracking-tighter">
                 {date.toLocaleTimeString('en-US', timeOptions).replace(' ', '')}
             </div>
             <div className="font-righteous text-2xl sm:text-3xl text-accent-green mt-6 font-bold tracking-wider">
                 {date.toLocaleDateString('en-US', dateOptions)}
             </div>
          </div>
        );
      };
      
      const WeatherContent = ({ weatherData, loading, error, onRetry }) => {
        const getWeatherIconComponent = (code, weather) => {
          if (!weather) return DefaultWeatherIcon;
          const { sunrise, sunset } = weather.weather[0].astronomy[0];
          const now = new Date();
          const currentTimeInMinutes = now.getHours() * 60 + now.getMinutes();

          const parseTime = (timeStr) => {
            const [time, modifier] = timeStr.split(' ');
            let [hours, minutes] = time.split(':').map(Number);
            if (modifier === 'PM' && hours < 12) hours += 12;
            if (modifier === 'AM' && hours === 12) hours = 0;
            return hours * 60 + minutes;
          };
          
          let night = false;
          try {
            night = currentTimeInMinutes < parseTime(sunrise) || currentTimeInMinutes > parseTime(sunset);
          } catch (e) { console.error("Could not parse sunrise/sunset time", e); }
          
          const codeNum = parseInt(code, 10);
          if (night) {
            if (codeNum === 113) return ClearNightIcon;
            if (codeNum === 116) return PartlyCloudyNightIcon;
          }
          if (codeNum === 113) return SunnyIcon;
          if (codeNum === 116) return PartlyCloudyIcon;
          if (codeNum >= 119 && codeNum <= 122) return CloudyIcon;
          if ((codeNum >= 176 && codeNum <= 185) || (codeNum >= 263 && codeNum <= 308)) return RainyIcon;
          if (codeNum >= 323 && codeNum <= 338) return SnowyIcon;
          if (codeNum === 200) return StormyIcon;
          if (codeNum === 143 || codeNum === 248 || codeNum === 260) return FogIcon;
          return DefaultWeatherIcon;
        };
        
        const renderContent = () => {
            if (loading) return <div className="flex flex-col items-center justify-center text-center"><div className="w-16 h-16 border-4 border-dashed rounded-full animate-spin border-accent-yellow mb-4"></div><p className="text-xl font-bold text-brand-muted">Fetching weather...</p></div>;
            if (error) return <div className="text-center text-accent-red"><p className="font-bold text-lg">Oops!</p><p>{error}</p> <button onClick={onRetry} className="mt-4 bg-accent-yellow text-brand-bg font-bold py-2 px-4 rounded-lg border-2 border-brand-border shadow-sharp transition-transform hover:scale-105">Try Again</button></div>;
            
            const current = weatherData?.current_condition?.[0];
            const area = weatherData?.nearest_area?.[0];
            if (!weatherData || !current || !area) return <div className="text-center text-accent-red"><p>Incomplete weather data.</p><button onClick={onRetry} className="mt-4 bg-accent-yellow text-brand-bg font-bold py-2 px-4 rounded-lg border-2 border-brand-border shadow-sharp transition-transform hover:scale-105">Try Again</button></div>;
            
            const IconComponent = getWeatherIconComponent(current.weatherCode, weatherData);
            return (
              <div className="w-full h-full flex items-center justify-center">
                <div className="bg-black/20 backdrop-blur-sm p-8 rounded-2xl border border-white/10 w-full max-w-sm text-center flex flex-col items-center justify-center gap-4 font-righteous">
                    <div className="w-36 h-36 animate-pulse-slow">
                        <IconComponent className="w-full h-full" />
                    </div>
                    <div className="-mt-4">
                        <p className="text-7xl font-black text-accent-red">{current.temp_C}°C</p>
                        <p className="text-2xl text-brand-muted">{current.weatherDesc[0].value}</p>
                    </div>
                    <div>
                        <p className="text-3xl font-bold text-brand-off-white">{area.areaName[0].value}, {area.country[0].value}</p>
                        <p className="text-xl text-accent-green">Feels like {current.FeelsLikeC}°C</p>
                    </div>
                    <div className="text-lg text-brand-muted">
                        <p>Wind: {current.windspeedKmph} km/h</p>
                        <p>Humidity: {current.humidity}%</p>
                    </div>
                </div>
              </div>
            );
        };
        
        return <div className="h-full flex items-center justify-center">{renderContent()}</div>;
      };

      const MusicPlayer = ({ tracks, currentTrackIndex, isPlaying, progress, error, onTogglePlay, onNext, onPrev, onSelectTrack }) => {
        const currentTrack = tracks[currentTrackIndex];
        return (
          <div className="flex flex-col h-full text-brand-off-white">
             <div className="flex-shrink-0 flex items-center gap-6 p-4 border-b-2 border-white/10">
                <div className={`w-28 h-28 bg-accent-green rounded-lg flex items-center justify-center border-2 border-black/20 flex-shrink-0 shadow-lg ${isPlaying ? 'animate-pulse-slow' : ''}`}>
                    <MusicIcon className="w-16 h-16 text-brand-bg/70" />
                </div>
                <div className="flex-1 overflow-hidden">
                    <h2 className="font-righteous text-3xl truncate" title={currentTrack.title}>{currentTrack.title}</h2>
                    <p className="text-xl text-brand-muted">{currentTrack.artist}</p>
                    {error && <p className="text-sm text-accent-red mt-1 font-bold">{error}</p>}
                </div>
             </div>
            <div className="py-6 flex-shrink-0 flex flex-col items-center gap-5">
                <div className="flex items-center justify-center gap-8">
                  <button onClick={onPrev} className="text-brand-muted hover:text-accent-red transition-colors" aria-label="Previous track"><PrevIcon/></button>
                  <button onClick={onTogglePlay} className="w-20 h-20 rounded-full bg-accent-yellow text-brand-bg border-4 border-black/30 flex items-center justify-center transition-transform hover:scale-110 shadow-lg" aria-label={isPlaying ? 'Pause' : 'Play'}>
                    {isPlaying ? <PauseIcon /> : <PlayIcon />}
                  </button>
                  <button onClick={onNext} className="text-brand-muted hover:text-accent-red transition-colors" aria-label="Next track"><NextIcon/></button>
                </div>
                 <div className="w-full max-w-sm bg-black/30 rounded-full h-3 overflow-hidden border-2 border-black/30">
                    <div className="bg-accent-green h-full rounded-full" style={{ width: `${progress}%`, transition: 'width 0.15s linear' }}></div>
                </div>
            </div>
            <div className="flex-grow overflow-y-auto pr-2">
              {tracks.map((track, index) => (
                <div 
                  key={index} 
                  onClick={() => onSelectTrack(index)}
                  className={`p-3 cursor-pointer rounded-lg mb-2 transition-all duration-200 border-2 ${index === currentTrackIndex ? 'bg-accent-red border-black/50' : 'border-transparent hover:bg-white/5 hover:translate-x-2'}`}
                >
                  <div className={`font-bold text-lg truncate ${index === currentTrackIndex ? 'text-brand-off-white' : 'text-brand-off-white'}`}>{track.title}</div>
                  <div className={`text-base ${index === currentTrackIndex ? 'text-brand-bg/80 font-bold' : 'text-brand-muted'}`}>{track.artist}</div>
                </div>
              ))}
            </div>
          </div>
        );
      };

      const NotesContent = () => {
        const [notes, setNotes] = useState(() => localStorage.getItem('pola-sovereign-notes') || '');
        
        useEffect(() => {
          localStorage.setItem('pola-sovereign-notes', notes);
        }, [notes]);

        return (
          <div className="h-full flex flex-col">
            <textarea
              className="w-full h-full bg-transparent text-brand-off-white font-nunito text-lg p-2 resize-none focus:outline-none placeholder-brand-muted/70"
              placeholder="Start typing your thoughts here..."
              value={notes}
              onChange={(e) => setNotes(e.target.value)}
              spellCheck="false"
            />
          </div>
        );
      };

      // --- MAIN APP ---
      const App = () => {
          const [activeView, setActiveView] = useState('home');
          const [animationClass, setAnimationClass] = useState('animate-drop-in');
          const { audioRef, ...audioPlayerProps } = useAudioPlayer(tracksData);
          
          const [date, setDate] = useState(new Date());
          const [weather, setWeather] = useState(null);
          const [weatherLoading, setWeatherLoading] = useState(true);
          const [weatherError, setWeatherError] = useState(null);

          useEffect(() => {
            const timerId = setInterval(() => setDate(new Date()), 1000);
            return () => clearInterval(timerId);
          }, []);

          const fetchWeather = useCallback(() => {
            setWeatherLoading(true);
            setWeatherError(null);
            fetch(`https://wttr.in/?format=j1`)
                .then(res => res.ok ? res.json() : Promise.reject('Weather service unavailable.'))
                .then(data => setWeather(data))
                .catch(err => setWeatherError(err.message || err))
                .finally(() => setWeatherLoading(false));
          }, []);

          useEffect(() => {
            fetchWeather();
          }, [fetchWeather]);

          let audioCtx = useRef(null);
          const playSound = useCallback((type) => {
            if (!audioCtx.current) {
              try { audioCtx.current = new (window.AudioContext || window.webkitAudioContext)(); } 
              catch (e) { console.error("Web Audio API is not supported"); return; }
            }
            if (audioCtx.current.state === 'suspended') audioCtx.current.resume();
            
            const oscillator = audioCtx.current.createOscillator();
            const gainNode = audioCtx.current.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.current.destination);
            
            if (type === 'open') {
              oscillator.type = 'triangle';
              oscillator.frequency.setValueAtTime(880, audioCtx.current.currentTime);
              gainNode.gain.setValueAtTime(0.06, audioCtx.current.currentTime);
              gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.current.currentTime + 0.3);
            } else { // 'close'
              oscillator.type = 'sine';
              oscillator.frequency.setValueAtTime(660, audioCtx.current.currentTime);
              gainNode.gain.setValueAtTime(0.06, audioCtx.current.currentTime);
              gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.current.currentTime + 0.2);
            }
            
            oscillator.start();
            oscillator.stop(audioCtx.current.currentTime + 0.3);
          }, []);

          const closeWindow = useCallback(() => {
              if (activeView) {
                  playSound('close');
                  setAnimationClass('animate-fall-out');
                  setTimeout(() => setActiveView(null), 300);
              }
          }, [activeView, playSound]);

          const openWindow = useCallback((id) => {
              if (activeView === id && id !== 'home') {
                  closeWindow();
                  return;
              }
              if (activeView === id) return;

              playSound('open');
              if (activeView) {
                  setAnimationClass('animate-fall-out');
                  setTimeout(() => {
                      setActiveView(id);
                      setAnimationClass('animate-drop-in');
                  }, 300);
              } else {
                  setActiveView(id);
                  setAnimationClass('animate-drop-in');
              }
          }, [activeView, playSound, closeWindow]);

          const renderContent = () => {
              if (!activeView) return null;
              switch (activeView) {
                  case 'home': return <HomeContent date={date} weather={weather} />;
                  case 'clock': return <ClockContent date={date} />;
                  case 'weather': return <WeatherContent weatherData={weather} loading={weatherLoading} error={weatherError} onRetry={fetchWeather} />;
                  case 'music': return <MusicPlayer tracks={tracksData} {...audioPlayerProps} />;
                  case 'notes': return <NotesContent />;
                  default: return null;
              }
          };

          let windowClass = 'max-w-xl';
          if (activeView === 'home') windowClass = 'max-w-2xl max-h-[720px]';
          else if (activeView === 'music') windowClass = 'max-w-lg max-h-[700px]';
          else if (activeView === 'notes') windowClass = 'max-w-lg max-h-[600px]';
          else windowClass = 'max-w-xl max-h-[600px]';


          return (
              <Fragment>
                  <audio ref={audioRef} />
                  {activeView && (
                      <Window
                          key={activeView}
                          title={viewTitles[activeView]}
                          onClose={closeWindow}
                          animationClass={animationClass}
                          className={windowClass}
                      >
                          {renderContent()}
                      </Window>
                  )}
                  <Dock onIconClick={openWindow} activeView={activeView} />
              </Fragment>
          );
      };

      // --- RENDER APP ---
      const rootElement = document.getElementById('root');
      if (rootElement) {
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
      } else {
        console.error("Root element not found. App could not be mounted.");
      }
    </script>
</body>
</html>
